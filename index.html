<html lang="ru">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>attention</title>
</head>
<body> 
    <link rel="stylesheet" href="style.css">
    <h1 class="logo">attention</h1>
    <div class="search">
        <div class="search-row">
        <input type="search" class="search2" placeholder="Поиск">
        <button class="N">Найти</button>
        </div>
        <div class="resu" id="ResuBTN">
<button class="re" id="reBTN">Рекомендации</button>
<button class="su" id="suBTN">Мои авторы</button>
    </div>
    </div>
    <div>
        <button class="new"  id="addPostBtn">+</button>
    </div>
    <div>
        <a href="./profile/profile1.html">
            <button class="p"> 
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
    </svg>
            </button>
        </a>
    </div>
    <div class="block"> 
    </div>
<div class="overlay">
  <div class="modal-content">
    <div class="modal-header">
  <h2>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14M5 12h14" />
    </svg>
    Создать пост
  </h2>
  <button class="modal-close" id="closeModalBtn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    </svg>
  </button>
</div>

    <div class="list">

      <label for="file-upload" class="img-card" id="preview-label">
        <span id="upload-text" class="te">+</span>
      </label>
      <input type="file" id="file-upload" class="hidden-input" accept="image/*">


      <input type="text" class="des" placeholder="Что у вас происходит?">

      <div class="schedule-section">
  <p class="section-title">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" />
      <polyline points="12 6 12 12 16 14" />
    </svg>
    Срок публикации
  </p>
  <div class="time-grid">
    <label class="time-card"><input type="radio" name="post-time" value="1"><span>1ч</span></label>
    <label class="time-card"><input type="radio" name="post-time" value="3"><span>3ч</span></label>
    <label class="time-card"><input type="radio" name="post-time" value="10"><span>10ч</span></label>
    <label class="time-card"><input type="radio" name="post-time" value="24" checked><span>1д</span></label>
    <label class="time-card"><input type="radio" name="post-time" value="72"><span>3д</span></label>
    <label class="time-card"><input type="radio" name="post-time" value="240"><span>10д</span></label>
  </div>
</div>

      <div class="boost">
  <p class="section-title">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
    </svg>
    Пакет продвижения (Буст)
  </p>
  <div class="boost-grid">
    <label class="boost-card"><input type="radio" name="boost-plan" value="0" checked><div class="boost-info"><span class="boost-time">Без буста</span><span class="boost-price">0₽</span></div></label>
    <label class="boost-card"><input type="radio" name="boost-plan" value="1"><div class="boost-info"><span class="boost-time">1 час</span><span class="boost-price">99₽</span></div></label>
    <label class="boost-card"><input type="radio" name="boost-plan" value="3"><div class="boost-info"><span class="boost-time">3 часа</span><span class="boost-price">297₽</span></div></label>
    <label class="boost-card"><input type="radio" name="boost-plan" value="10"><div class="boost-info"><span class="boost-time">10 часов <small>-10%</small></span><span class="boost-price">891₽</span></div></label>
    <label class="boost-card"><input type="radio" name="boost-plan" value="24"><div class="boost-info"><span class="boost-time">1 день <small>-15%</small></span><span class="boost-price">2 020₽</span></div></label>
    <label class="boost-card"><input type="radio" name="boost-plan" value="72"><div class="boost-info"><span class="boost-time">3 дня <small>-20%</small></span><span class="boost-price">5 702₽</span></div></label>
    <label class="boost-card"><input type="radio" name="boost-plan" value="240"><div class="boost-info"><span class="boost-time">10 дней <small>-30%</small></span><span class="boost-price">16 632₽</span></div></label>
  </div>
</div>

    
      <div class="publish">
        <button class="go" onclick="createPost()">Опубликовать</button>
      </div>
    </div>
  </div>
</div>

<div id="feed"></div>


    <div id="form">
        <div class="post-card">
    <div class="info">
        <a href="" class="nik">name</a>
        <time datetime="PT1H" class="time">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="10" />
  <polyline points="12 6 12 12 16 14" />
</svg>
            1h</time>

        <div class="butt"> 
            <button class="like">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <polyline points="18 15 12 9 6 15" />
</svg>
            </button>
            <span class="like-count">0</span>
            <button class="diz">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <polyline points="6 9 12 15 18 9" />
</svg>
            </button>
        </div>
<span class="views">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
        <circle cx="12" cy="12" r="3" />
    </svg>
    <span class="views-count">0</span>
</span>

    </div>
    <div class="post-image">
        <img src="" alt="">
    </div>
    <div class="description">
        <p class="post-description">*Описание происходящего на фото*</p>
    </div>
</div>
    </div>
<div id="confirmOverlay" class="confirm-overlay">
    <div class="confirm-box">
        <div class="confirm-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
        </div>
        <div class="confirm-title">Вы уверены?</div>
        <div class="confirm-message" id="confirmMessage">Скрыть автора на 45 дней?</div>
        <div class="confirm-actions">
            <button class="confirm-btn confirm-cancel" id="confirmCancel">Отмена</button>
            <button class="confirm-btn confirm-ok" id="confirmOk">Да, скрыть</button>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
